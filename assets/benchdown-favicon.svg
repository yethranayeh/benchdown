<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760">
  <title>benchdown</title>
  <defs>
    <g id="mark" transform="translate(158 121) scale(0.74)">
      <rect x="10" y="10" width="80" height="580" rx="16"/>
      <rect x="110" y="10" width="80" height="580" rx="16"/>
      <rect x="210" y="210" width="80" height="80" rx="16"/>
      <rect x="310" y="210" width="80" height="80" rx="16"/>
      <rect x="210" y="310" width="80" height="80" rx="16"/>
      <rect x="310" y="310" width="80" height="80" rx="16"/>
      <rect x="410" y="310" width="80" height="80" rx="16"/>
      <rect x="510" y="310" width="80" height="280" rx="16"/>
      <rect x="410" y="410" width="80" height="280" rx="16"/>
      <rect x="110" y="610" width="80" height="80" rx="16"/>
      <rect x="210" y="610" width="80" height="80" rx="16"/>
      <rect x="310" y="610" width="80" height="80" rx="16"/>
    </g>
    <mask id="cut">
      <rect width="760" height="760" rx="176" fill="#fff"/>
      <use href="#mark" fill="#000"/>
    </mask>
  </defs>
  <style>
    /* Light: the tab strip shows through the mark, as in favicon.png. Dark: the
       tile would swallow a hole, so the mark is inked in the light brand cream
       instead. Browsers evaluate this against the system colour scheme. */
    .on-dark {
      display: none;
    }
    @media (prefers-color-scheme: dark) {
      .on-light {
        display: none;
      }
      .on-dark {
        display: inline;
      }
    }
    .tile {
      fill: #17150f;
    }
    .mark {
      fill: #f4f1e9;
    }
  </style>
  <g class="on-light">
    <rect class="tile" width="760" height="760" rx="176" mask="url(#cut)"/>
  </g>
  <g class="on-dark">
    <rect class="tile" width="760" height="760" rx="176"/>
    <use class="mark" href="#mark"/>
  </g>
</svg>
