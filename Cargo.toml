[package]
name = "benchdown"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Measure a command's processor energy the way hyperfine measures its time"
license = "MIT"
readme = "README.md"
exclude = ["/assets"]
repository = "https://github.com/yethranayeh/benchdown"
keywords = ["benchmark", "energy", "power", "profiling", "measurement"]
categories = ["command-line-utilities", "development-tools::profiling", "hardware-support"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
plist = { version = "1.8", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1"
signal-hook = "0.4.6"

# AppleSMC reads on macOS, at user level and without sudo.
[target.'cfg(target_os = "macos")'.dependencies]
smc = "0.2.4"
