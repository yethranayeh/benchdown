name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS (fmt, clippy, tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  package:
    name: Crate package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds the tarball the registry would receive, so a file behind
      # include_str!, the licences or the readme cannot go missing unnoticed.
      - run: cargo publish --dry-run --locked

  linux:
    name: Linux (clippy, tests compiled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Some tests drive the preflight with recorded pmset/sysctl/ps output and
      # assert what macOS produced, so they are compiled here rather than run.
      # Compiling them is what keeps the Linux half from rotting.
      - run: cargo clippy --all-targets -- -D warnings
