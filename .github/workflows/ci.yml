name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS (fmt, clippy, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    name: Linux (clippy, tests compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Some tests drive the preflight with recorded pmset/sysctl/ps output and
      # assert what macOS produced, so they are compiled here rather than run.
      # Compiling them is what keeps the Linux half from rotting.
      - run: cargo clippy --all-targets -- -D warnings
