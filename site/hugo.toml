baseURL = "https://yethranayeh.github.io/benchdown/"
locale = "en"
title = "benchdown"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "section"]

[module]
  # Default mounts, restated because adding one mount replaces the whole set.
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "data"
    target = "data"
  # The brand files live at the repository root, so the site reads them there
  # instead of keeping a second copy that can drift.
  [[module.mounts]]
    source = "../assets"
    target = "assets/brand"

  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[pagination]
  pagerSize = 20

[params]
  centerTheme = true
  fullWidthTheme = false

[languages]
  [languages.en]
    title = "benchdown"
    copyright = "© 2026 Alper Halil"

    [languages.en.params]
      subtitle = "Measure how much processor energy a command uses."
      readMore = "Read"
      menuMore = "More"

      [languages.en.params.logo]
        logoText = "benchdown"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "crates"
        name = "crates.io"
        url = "https://crates.io/crates/benchdown"
        weight = 1
      [[languages.en.menu.main]]
        identifier = "docs"
        name = "docs.rs"
        url = "https://docs.rs/benchdown"
        weight = 2
      [[languages.en.menu.main]]
        identifier = "github"
        name = "GitHub"
        url = "https://github.com/yethranayeh/benchdown"
        weight = 3
